# Data sources for the `fetch` stage in dvc.yaml.
# Commits are pinned so `dvc repro` is reproducible; bump one deliberately to take upstream changes.
# `paths` are repo-relative; a trailing slash means "everything under this directory".

paths:
  raw_dir: data/raw
  cache_dir: .cache/beir  # full BEIR zips (~2.2 GB), kept out of git and DVC

datasets:
  poisonedrag:
    repo: sleeepeer/PoisonedRAG
    commit: f660d72174f06b13fae5163ce656e7b235db858f
    license: MIT
    surface: rag
    role: train + in-distribution test
    paths:
      - results/adv_targeted_results/
      - results/beir_results/nq-contriever.json
      - results/beir_results/msmarco-contriever.json
      - results/beir_results/hotpotqa-contriever.json
    # Only the passages PoisonedRAG targets: each target query's top-k Contriever
    # results plus its gold (qrels) passages. Splits match PoisonedRAG's load_beir_datasets.
    beir:
      url: https://public.ukp.informatik.tu-darmstadt.de/thakur/BEIR/datasets/{name}.zip
      top_k: 100
      subsets:
        nq: test
        msmarco: train
        hotpotqa: test

  bipia:
    repo: microsoft/BIPIA
    commit: a004b69ec0dd446e0afd461d98cb5e96e120a5d0
    license: MIT (TableQA context derived from WikiTableQuestions, CC BY-SA 4.0)
    surface: rag
    role: attack-family diversity
    # WebQA (NewsQA) and Summarization (XSum) contexts are not redistributed upstream;
    # they need a separate generation stage.
    paths:
      - benchmark/email/
      - benchmark/table/
      - benchmark/code/
      - benchmark/text_attack_train.json
      - benchmark/text_attack_test.json
      - benchmark/code_attack_train.json
      - benchmark/code_attack_test.json

  mcptox:
    repo: zhiqiangwang4/MCPTox-Benchmark
    commit: f85189f9ad12504c197c7f920ab818a40657b1fa
    license: none stated upstream (team-internal copy approved)
    surface: mcp
    role: held-out surface for LOSO
    paths:
      - response_all.json
      - pure_tool.json

  msb:
    repo: dongsenzhang/MSB
    commit: c1d6a70171e4d2c44c87a2ae909d13df00c6aa8d
    license: MIT
    surface: both
    role: fully held-out transfer test
    paths:
      - data/agent_task.jsonl
      - data/attack_task.jsonl
      - data/attack_type.jsonl
      - data/tools/

# Not fetched: AgentDojo ships its suites inside the Python package.
harnesses:
  agentdojo:
    package: agentdojo
    version: 0.1.35
    license: MIT
    surface: agent
    role: end-to-end ASR harness
