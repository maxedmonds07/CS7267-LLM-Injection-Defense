      config.yaml:
        datasets:
          poisonedrag:
            repo: sleeepeer/PoisonedRAG
            commit: f660d72174f06b13fae5163ce656e7b235db858f
            license: MIT
            surface: rag
            role: train + in-distribution test
            paths:
            - results/adv_targeted_results/
            - results/beir_results/nq-contriever.json
            - results/beir_results/msmarco-contriever.json
            - results/beir_results/hotpotqa-contriever.json
            beir:
              url: 
                https://public.ukp.informatik.tu-darmstadt.de/thakur/BEIR/datasets/{name}.zip
              top_k: 100
              subsets:
                nq: test
                msmarco: train
                hotpotqa: test
          bipia:
            repo: microsoft/BIPIA
            commit: a004b69ec0dd446e0afd461d98cb5e96e120a5d0
            license: MIT (TableQA context derived from WikiTableQuestions, CC 
              BY-SA 4.0)
            surface: rag
            role: attack-family diversity
            paths:
            - benchmark/email/
            - benchmark/table/
            - benchmark/code/
            - benchmark/qa/
            - benchmark/abstract/
            - benchmark/text_attack_train.json
            - benchmark/text_attack_test.json
            - benchmark/code_attack_train.json
            - benchmark/code_attack_test.json
          mcptox:
            repo: zhiqiangwang4/MCPTox-Benchmark
            commit: f85189f9ad12504c197c7f920ab818a40657b1fa
            license: none stated upstream (team-internal copy approved)
            surface: mcp
            role: held-out surface for LOSO
            paths:
            - response_all.json
            - pure_tool.json
          msb:
            repo: dongsenzhang/MSB
            commit: c1d6a70171e4d2c44c87a2ae909d13df00c6aa8d
            license: MIT
            surface: both
            role: fully held-out transfer test
            paths:
            - data/agent_task.jsonl
            - data/attack_task.jsonl
            - data/attack_type.jsonl
            - data/tools/
            - data/prompt_template.py
        paths.raw_dir: data/raw
    outs:
    - path: data/raw
      hash: md5
      md5: ca94566d1a031a8b567914d98c5d29ec.dir
      size: 77840275
      nfiles: 135
