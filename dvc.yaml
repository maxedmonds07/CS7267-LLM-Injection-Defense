stages:
  fetch:
    cmd: python src/data/fetch.py --config config.yaml
    deps:
      - src/data/fetch.py
    params:
      - config.yaml:
          - paths.raw_dir
          - datasets
    outs:
      - data/raw

  bipia_summarization:
    cmd: python src/data/generate_bipia.py --config config.yaml --task bipia_summarization
    deps:
      - src/data/generate_bipia.py
      - src/data/fetch.py
      - data/raw/bipia/benchmark/abstract
    params:
      - config.yaml:
          - paths.generated_dir
          - generated.bipia_summarization
    outs:
      - data/generated/bipia/abstract

  # Its input CSV is built and tracked by `make newsqa` (see Makefile).
  bipia_webqa:
    cmd: python src/data/generate_bipia.py --config config.yaml --task bipia_webqa
    deps:
      - src/data/generate_bipia.py
      - src/data/fetch.py
      - data/raw/bipia/benchmark/qa
      - data/external/newsqa/combined-newsqa-data-v1.csv
    params:
      - config.yaml:
          - paths.generated_dir
          - generated.bipia_webqa
    outs:
      - data/generated/bipia/qa

  # One labeled table of untrusted text segments; see
  # docs/superpowers/specs/2026-09-29-build-dataset-design.md
  build_dataset:
    cmd: python src/data/build_dataset.py --config config.yaml
    deps:
      - src/data/build_dataset.py
      - data/raw
      - data/generated/bipia/abstract
      - data/generated/bipia/qa
    params:
      - config.yaml:
          - dataset
          - paths.raw_dir
          - paths.generated_dir
          - datasets.poisonedrag.beir.subsets
    outs:
      - data/processed/dataset.parquet
    metrics:
      - data/processed/summary.json:
          cache: false
